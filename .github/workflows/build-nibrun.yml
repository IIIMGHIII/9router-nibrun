name: Build 9Router v0.5.35 for Nibrun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download 9Router v0.5.35
        shell: bash
        run: |
          set -eux

          mkdir -p work

          curl -L --fail \
            https://github.com/decolua/9router/archive/refs/tags/v0.5.35.tar.gz \
            -o work/9router.tar.gz

          tar -xzf work/9router.tar.gz -C work

          find work -maxdepth 3 -type f \
            \( -name package.json -o -name server.js \) \
            -print

      - name: Locate 9Router
        shell: bash
        run: |
          set -eux

          APP_DIR="$(find "$GITHUB_WORKSPACE/work" \
            -type f \
            -name package.json \
            -print0 | \
            xargs -0 -n1 dirname | \
            while read d; do
              if grep -q '"name"[[:space:]]*:[[:space:]]*"9router-app"' "$d/package.json"; then
                echo "$d"
                break
              fi
            done)"

          if [ -z "$APP_DIR" ]; then
            echo "9Router package.json was not found"
            find "$GITHUB_WORKSPACE/work" -maxdepth 5 -type f -name package.json -print
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Found 9Router at: $APP_DIR"

      - name: Check version
        shell: bash
        run: |
          set -eux

          node -p "require('$APP_DIR/package.json').version"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -eux

          npm install \
            --no-audit \
            --no-fund \
            --ignore-scripts

      - name: Build 9Router
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -eux

          npm run build

      - name: Verify build
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -eux

          test -f .next-cli-build/BUILD_ID
          test -d .next-cli-build/server
          test -d .next-cli-build/static

          echo "Build:"
          du -sh .next-cli-build

          echo "node_modules:"
          du -sh node_modules

      - name: Install postject
        shell: bash
        run: |
          set -eux

          npm install -g postject@1.0.0-alpha.6

      - name: Create SEA launcher
        shell: bash
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/nibrun-main.js" <<'EOF'
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const { execFileSync } = require('child_process');
          const { getAsset } = require('node:sea');

          const runtime = path.join(
            os.tmpdir(),
            '9router-' + process.pid
          );

          fs.mkdirSync(runtime, {
            recursive: true
          });

          const archive = getAsset(
            '9router-runtime',
            'buffer'
          );

          const archivePath = path.join(
            runtime,
            'runtime.tar.gz'
          );

          fs.writeFileSync(
            archivePath,
            archive
          );

          execFileSync(
            'tar',
            [
              '-xzf',
              archivePath,
              '-C',
              runtime
            ],
            {
              stdio: 'inherit'
            }
          );

          fs.unlinkSync(archivePath);

          process.env.NODE_ENV = 'production';

          process.env.PORT =
            process.env.PORT ||
            process.env.NIBRUN_HTTP_PORT ||
            '3000';

          process.env.HOSTNAME =
            process.env.HOSTNAME ||
            '0.0.0.0';

          process.chdir(runtime);

          require(
            path.join(runtime, 'custom-server.js')
          );
          EOF

      - name: Create runtime archive
        shell: bash
        run: |
          set -eux

          rm -rf runtime
          mkdir runtime

          cp -a "$APP_DIR/.next-cli-build" runtime/
          cp -a "$APP_DIR/node_modules" runtime/
          cp -a "$APP_DIR/public" runtime/
          cp -a "$APP_DIR/package.json" runtime/
          cp -a "$APP_DIR/server.js" runtime/
          cp -a "$APP_DIR/custom-server.js" runtime/

          tar \
            -C runtime \
            -czf nibrun-runtime.tar.gz \
            .

          ls -lh nibrun-runtime.tar.gz

      - name: Create SEA configuration
        shell: bash
        run: |
          set -eux

          cat > sea-config.json <<'EOF'
          {
            "main": "./nibrun-main.js",
            "output": "./9router-nibrun.blob",
            "disableExperimentalSEAWarning": true,
            "useSnapshot": false,
            "useCodeCache": true,
            "assets": {
              "9router-runtime": "./nibrun-runtime.tar.gz"
            }
          }
          EOF

          cat sea-config.json

      - name: Generate SEA blob
        shell: bash
        run: |
          set -eux

          node \
            --experimental-sea-config \
            sea-config.json

          ls -lh 9router-nibrun.blob

      - name: Create Linux executable
        shell: bash
        run: |
          set -eux

          cp "$(command -v node)" 9router-nibrun

          chmod +x 9router-nibrun

          postject \
            9router-nibrun \
            NODE_SEA_BLOB \
            9router-nibrun.blob \
            --sentinel-fuse \
            NODE_SEA_FUSE_f6d2a3c8-9e51-4b7f-a2d4-9router

          chmod +x 9router-nibrun

      - name: Verify executable
        shell: bash
        run: |
          set -eux

          file 9router-nibrun

          ls -lh 9router-nibrun

          sha256sum 9router-nibrun

      - name: Package result
        shell: bash
        run: |
          set -eux

          mkdir -p dist

          cp 9router-nibrun dist/

          cat > dist/README.txt <<'EOF'
          9Router v0.5.35
          Nibrun Linux x86_64 build

          Deploy:

          nib run ./9router-nibrun \
            --name 9router \
            --port 3000

          The application listens on the Nibrun HTTP port.
          EOF

          tar -czf \
            9router-v0.5.35-nibrun-linux-x64.tar.gz \
            -C dist \
            .

          sha256sum \
            9router-nibrun \
            9router-v0.5.35-nibrun-linux-x64.tar.gz \
            > SHA256SUMS.txt

      - name: Upload Nibrun binary
        uses: actions/upload-artifact@v4
        with:
          name: 9router-v0.5.35-nibrun-linux-x64
          path: |
            9router-nibrun
            9router-v0.5.35-nibrun-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
