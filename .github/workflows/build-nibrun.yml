name: Build 9Router v0.5.35 for Nibrun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 Nibrun build
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      # ------------------------------------------------------------
      # Download the ACTUAL published npm package.
      #
      # This is important:
      # GitHub source != the prebuilt npm package you tested locally.
      # ------------------------------------------------------------

      - name: Download 9Router 0.5.35 npm package
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/work"

          cd "$GITHUB_WORKSPACE/work"

          npm pack 9router@0.5.35

          ls -lh

          test -f 9router-0.5.35.tgz

          tar -xzf 9router-0.5.35.tgz

          echo "=== PACKAGE ==="
          find package -maxdepth 3 -type f | sort | head -200

      # ------------------------------------------------------------
      # Verify the package is the one we expect.
      # ------------------------------------------------------------

      - name: Verify 9Router package
        shell: bash
        run: |
          set -eux

          APP_DIR="$GITHUB_WORKSPACE/work/package/app"

          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/server.js"
          test -f "$APP_DIR/custom-server.js"

          test -d "$APP_DIR/.next-cli-build"

          VERSION="$(node -p "require('$APP_DIR/package.json').version")"

          echo "9Router version: $VERSION"

          test "$VERSION" = "0.5.35"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Show what came from npm.
      # ------------------------------------------------------------

      - name: Inspect npm package
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -eux

          echo "=== package.json ==="
          cat package.json

          echo
          echo "=== BUILD ==="
          du -sh .next-cli-build

          echo
          echo "=== NODE MODULES BEFORE REINSTALL ==="
          du -sh node_modules || true

          echo
          echo "=== SERVER ==="
          sed -n '1,100p' server.js

      # ------------------------------------------------------------
      # Remove the npm-package node_modules.
      #
      # We DO NOT trust the pre-existing node_modules because they
      # may have been produced for another operating system.
      # ------------------------------------------------------------

      - name: Reinstall Linux dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -eux

          rm -rf node_modules

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund \
            --ignore-scripts

          echo "=== LINUX NODE_MODULES ==="
          du -sh node_modules

          find node_modules -maxdepth 2 -type d | head -100

      # ------------------------------------------------------------
      # Verify important runtime dependencies.
      # ------------------------------------------------------------

      - name: Verify runtime dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -eux

          node -e "require('next'); console.log('next OK')"
          node -e "require('express'); console.log('express OK')"
          node -e "require('sql.js'); console.log('sql.js OK')"
          node -e "require('jose'); console.log('jose OK')"
          node -e "require('undici'); console.log('undici OK')"

      # ------------------------------------------------------------
      # Verify the already-built Next.js application.
      #
      # We intentionally DON'T run npm run build here.
      # The npm package already contains .next-cli-build.
      # ------------------------------------------------------------

      - name: Verify prebuilt Next.js application
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -eux

          test -f .next-cli-build/BUILD_ID
          test -d .next-cli-build/server
          test -d .next-cli-build/static

          echo "=== BUILD ID ==="
          cat .next-cli-build/BUILD_ID

          echo
          echo "=== BUILD SIZE ==="
          du -sh .next-cli-build

          echo
          echo "=== SERVER FILES ==="
          find .next-cli-build/server \
            -maxdepth 2 \
            -type f \
            | head -100

      # ------------------------------------------------------------
      # Test 9Router normally BEFORE creating the executable.
      # ------------------------------------------------------------

      - name: Test 9Router runtime
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -eux

          PORT=20127 \
          HOSTNAME=127.0.0.1 \
          node server.js > "$GITHUB_WORKSPACE/9router-test.log" 2>&1 &

          SERVER_PID=$!

          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          echo "Server PID: $SERVER_PID"

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:20127/ \
              -o /tmp/9router-response \
              2>/dev/null; then

              echo
              echo "=== 9ROUTER RESPONSE ==="
              head -c 500 /tmp/9router-response || true
              echo

              break
            fi

            sleep 1

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "9Router exited."

              echo "=== SERVER LOG ==="
              cat "$GITHUB_WORKSPACE/9router-test.log"

              exit 1
            fi
          done

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "9Router failed to stay running."

            cat "$GITHUB_WORKSPACE/9router-test.log"

            exit 1
          fi

          echo
          echo "9Router runtime test passed."

      # ------------------------------------------------------------
      # Create a self-contained runtime archive.
      # ------------------------------------------------------------

      - name: Create runtime archive
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/runtime"

          mkdir -p "$GITHUB_WORKSPACE/runtime"

          cp -a \
            "$APP_DIR/.next-cli-build" \
            "$GITHUB_WORKSPACE/runtime/"

          cp -a \
            "$APP_DIR/node_modules" \
            "$GITHUB_WORKSPACE/runtime/"

          cp -a \
            "$APP_DIR/public" \
            "$GITHUB_WORKSPACE/runtime/"

          cp \
            "$APP_DIR/package.json" \
            "$GITHUB_WORKSPACE/runtime/"

          cp \
            "$APP_DIR/server.js" \
            "$GITHUB_WORKSPACE/runtime/"

          cp \
            "$APP_DIR/custom-server.js" \
            "$GITHUB_WORKSPACE/runtime/"

          echo "=== RUNTIME SIZE ==="
          du -sh "$GITHUB_WORKSPACE/runtime"

          echo "=== RUNTIME CONTENT ==="
          find "$GITHUB_WORKSPACE/runtime" \
            -maxdepth 2 \
            -type d \
            | sort

          tar \
            -C "$GITHUB_WORKSPACE/runtime" \
            -czf "$GITHUB_WORKSPACE/nibrun-runtime.tar.gz" \
            .

          echo "=== ARCHIVE ==="
          ls -lh "$GITHUB_WORKSPACE/nibrun-runtime.tar.gz"

      # ------------------------------------------------------------
      # Create Node SEA entry point.
      # ------------------------------------------------------------

      - name: Create Nibrun launcher
        shell: bash
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/nibrun-main.js" <<'EOF'
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const { execFileSync } = require('child_process');
          const { getAsset } = require('node:sea');

          const runtime = path.join(
            os.tmpdir(),
            '9router-nibrun-' + process.pid
          );

          fs.mkdirSync(runtime, {
            recursive: true
          });

          const archive = getAsset(
            '9router-runtime',
            'buffer'
          );

          const archivePath = path.join(
            runtime,
            'runtime.tar.gz'
          );

          fs.writeFileSync(
            archivePath,
            archive,
            {
              mode: 0o600
            }
          );

          execFileSync(
            'tar',
            [
              '-xzf',
              archivePath,
              '-C',
              runtime
            ],
            {
              stdio: 'inherit'
            }
          );

          fs.unlinkSync(archivePath);

          process.env.NODE_ENV = 'production';

          process.env.PORT =
            process.env.PORT ||
            process.env.NIBRUN_HTTP_PORT ||
            '3000';

          process.env.HOSTNAME =
            process.env.HOSTNAME ||
            '0.0.0.0';

          process.chdir(runtime);

          require(
            path.join(
              runtime,
              'custom-server.js'
            )
          );
          EOF

          echo "=== LAUNCHER ==="
          cat "$GITHUB_WORKSPACE/nibrun-main.js"

      # ------------------------------------------------------------
      # Create Node SEA configuration.
      # ------------------------------------------------------------

      - name: Create SEA configuration
        shell: bash
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/sea-config.json" <<'EOF'
          {
            "main": "./nibrun-main.js",
            "output": "./9router-nibrun.blob",
            "disableExperimentalSEAWarning": true,
            "useSnapshot": false,
            "useCodeCache": true,
            "assets": {
              "9router-runtime": "./nibrun-runtime.tar.gz"
            }
          }
          EOF

          cat "$GITHUB_WORKSPACE/sea-config.json"

      # ------------------------------------------------------------
      # Generate SEA blob.
      # ------------------------------------------------------------

      - name: Generate SEA blob
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          node \
            --experimental-sea-config \
            sea-config.json

          test -f 9router-nibrun.blob

          ls -lh 9router-nibrun.blob

      # ------------------------------------------------------------
      # Install postject.
      # ------------------------------------------------------------

      - name: Install postject
        shell: bash
        run: |
          set -eux

          npm install \
            --global \
            postject@1.0.0-alpha.6

          postject --version

      # ------------------------------------------------------------
      # Copy Linux Node executable and inject SEA blob.
      # ------------------------------------------------------------

      - name: Create Linux x64 Nibrun executable
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          cp "$(command -v node)" 9router-nibrun

          chmod +x 9router-nibrun

          file 9router-nibrun

          postject \
            9router-nibrun \
            NODE_SEA_BLOB \
            9router-nibrun.blob \
            --sentinel-fuse \
            NODE_SEA_FUSE_f6d2a3c8-9e51-4b7f-a2d4-9router

          chmod +x 9router-nibrun

      # ------------------------------------------------------------
      # Verify executable.
      # ------------------------------------------------------------

      - name: Verify Nibrun executable
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          echo "=== FILE ==="
          file 9router-nibrun

          echo
          echo "=== SIZE ==="
          ls -lh 9router-nibrun

          echo
          echo "=== NODE SEA TEST ==="

          ./9router-nibrun \
            --version || true

      # ------------------------------------------------------------
      # Test the actual generated executable.
      # ------------------------------------------------------------

      - name: Test Nibrun executable
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          PORT=3000 \
          HOSTNAME=127.0.0.1 \
          ./9router-nibrun \
            > "$GITHUB_WORKSPACE/nibrun-test.log" 2>&1 &

          SERVER_PID=$!

          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          echo "Executable PID: $SERVER_PID"

          SUCCESS=0

          for i in $(seq 1 45); do

            if curl -fsS \
              http://127.0.0.1:3000/ \
              -o /tmp/nibrun-response \
              2>/dev/null; then

              SUCCESS=1

              echo
              echo "=== RESPONSE ==="
              head -c 1000 /tmp/nibrun-response || true
              echo

              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo
              echo "=== EXECUTABLE LOG ==="
              cat "$GITHUB_WORKSPACE/nibrun-test.log"

              exit 1
            fi

            sleep 1
          done

          if [ "$SUCCESS" != "1" ]; then
            echo "Nibrun executable did not answer HTTP."

            echo
            echo "=== EXECUTABLE LOG ==="
            cat "$GITHUB_WORKSPACE/nibrun-test.log"

            exit 1
          fi

          echo
          echo "Nibrun executable test PASSED."

      # ------------------------------------------------------------
      # Package artifact.
      # ------------------------------------------------------------

      - name: Package final Nibrun build
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          rm -rf dist

          mkdir dist

          cp \
            9router-nibrun \
            dist/

          cat > dist/README.txt <<'EOF'
          9Router v0.5.35
          Nibrun Linux x86_64 executable

          Deploy with:

            nib run ./9router-nibrun \
              --name 9router \
              --port 3000

          The application listens on the Nibrun HTTP port.

          No Docker or Podman is required.
          EOF

          tar \
            -czf \
            9router-v0.5.35-nibrun-linux-x64.tar.gz \
            -C dist \
            .

          sha256sum \
            9router-nibrun \
            9router-v0.5.35-nibrun-linux-x64.tar.gz \
            > SHA256SUMS.txt

          echo
          echo "=== FINAL FILES ==="

          ls -lh \
            9router-nibrun \
            9router-v0.5.35-nibrun-linux-x64.tar.gz \
            SHA256SUMS.txt

          echo
          echo "=== SHA256 ==="

          cat SHA256SUMS.txt

      # ------------------------------------------------------------
      # Upload artifact.
      # ------------------------------------------------------------

      - name: Upload Nibrun executable
        uses: actions/upload-artifact@v4
        with:
          name: 9router-v0.5.35-nibrun-linux-x64
          path: |
            9router-nibrun
            9router-v0.5.35-nibrun-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
