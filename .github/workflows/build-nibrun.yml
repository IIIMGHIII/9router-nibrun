      - name: Archive the standalone build
        run: |
          tar czf app-bundle.tar.gz -C 9router/.next/standalone .
          sha256sum app-bundle.tar.gz | awk '{print $1}' > bundle.sha256

      - name: Write launcher
        run: |
          STAMP=$(cat bundle.sha256)
          cat > stamp.js << EOF
          export const BUNDLE_STAMP = "${STAMP}";
          EOF
          cat > launcher.js << 'EOF'
          import bundleAsset from "./app-bundle.tar.gz" with { type: "file" };
          import { BUNDLE_STAMP } from "./stamp.js";
          import { existsSync, mkdirSync, rmSync, writeFileSync, readFileSync } from "fs";
          import path from "path";

          const nibrunDataDir = process.env.NIBRUN_DATA_DIR || process.env.DATA_DIR || "/app/data";
          const codeDir = path.join(nibrunDataDir, "app-code");
          const stateDir = path.join(nibrunDataDir, "state");
          const stampPath = path.join(nibrunDataDir, ".app-code-stamp");

          mkdirSync(codeDir, { recursive: true });
          mkdirSync(stateDir, { recursive: true });

          const ready =
            existsSync(path.join(codeDir, "custom-server.js")) &&
            existsSync(path.join(codeDir, "server.js")) &&
            existsSync(stampPath) &&
            readFileSync(stampPath, "utf8").trim() === BUNDLE_STAMP;

          if (!ready) {
            rmSync(codeDir, { recursive: true, force: true });
            mkdirSync(codeDir, { recursive: true });
            const tarBuf = await Bun.file(bundleAsset).bytes();
            const count = await new Bun.Archive(tarBuf).extract(codeDir);
            console.log(`[nibrun] extracted ${count} entries`);
            writeFileSync(stampPath, BUNDLE_STAMP);
          }

          // HOME=/app is read-only; keep 9router state off the extracted code tree.
          process.env.HOME = stateDir;
          process.env.DATA_DIR = stateDir;
          process.env.NODE_ENV = "production";
          // Next binds to HOSTNAME. Do not use NIBRUN_HOSTNAME (public DNS).
          process.env.HOSTNAME = "0.0.0.0";
          if (process.env.NIBRUN_HTTP_PORT) {
            process.env.PORT = process.env.NIBRUN_HTTP_PORT;
          }

          process.chdir(codeDir);
          // custom-server.js only starts Next when it is main — require the wrap,
          // then start standalone server.js ourselves.
          require(path.join(codeDir, "custom-server.js"));
          require(path.join(codeDir, "server.js"));
          EOF

      - name: Compile launcher to a single Linux x64 binary
        run: |
          bun build --compile \
            --target=bun-linux-x64 \
            ./launcher.js \
            --outfile 9router-linux-x64
