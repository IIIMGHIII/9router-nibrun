name: Build nibrun binary

on:
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the release + upload the asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # This repo holds only this workflow, not 9router's source —
      # pull the actual app from upstream. Pin `ref` to a release tag
      # (e.g. v0.5.35) instead of `master` if you want reproducible builds.
      - name: Checkout 9router source
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: master

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 9router installs with npm but builds fine under bun for this step,
      # matching the repo's own build:bun script.
      - name: Install dependencies
        run: npm install

      - name: Build Next.js standalone bundle
        run: bun run build:bun
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # custom-server.js locates server.js via a *computed* path
      # (path.join(__dirname, "server.js")), so Bun's --compile bundler can't
      # statically trace it and never embeds the real standalone server —
      # it falls through to a dev-only fallback that shells out to
      # next/dist/bin/next, baking in a CI-only absolute path that doesn't
      # exist at runtime. Force a literal require so Bun can actually embed it.
      - name: Patch custom-server.js for static bundling
        run: |
          node -e '
            const fs = require("fs");
            const file = ".next/standalone/custom-server.js";
            let src = fs.readFileSync(file, "utf8");
            const needle = `if (require.main === module) {
  const standalone = path.join(__dirname, "server.js");
  if (fs.existsSync(standalone)) {
    require(standalone);
  } else {
    // Repo checkout has no standalone build next to us. \`next start\` builds its HTTP
    // server in-process, so the wrapper above still sanitizes every request.
    const nextBin = require.resolve("next/dist/bin/next");
    process.argv = [process.argv[0], nextBin, "start", ...process.argv.slice(2)];
    require(nextBin);
  }
}`;
            if (!src.includes(needle)) {
              throw new Error("custom-server.js entrypoint block has changed upstream — update the patch");
            }
            src = src.replace(needle, `if (require.main === module) {\n  require("./server.js");\n}`);
            fs.writeFileSync(file, src);
          '

      # Compiles .next/standalone/custom-server.js (+ its bundled deps)
      # into one self-contained Linux x64 executable — the shape nibrun expects.
      - name: Compile to a single Linux x64 binary
        run: |
          bun build --compile \
            --target=bun-linux-x64 \
            ./.next/standalone/custom-server.js \
            --outfile 9router-linux-x64

      - name: Checksum
        run: sha256sum 9router-linux-x64 > SHA256SUMS

      # Tag with the date, so a same-day rerun doesn't collide.
      - name: Compute release tag
        id: tag
        run: |
          base="v$(date +%Y.%m.%d)"
          n=1
          tag="${base}-${n}"
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}-${n}"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            9router-linux-x64
            SHA256SUMS

      - name: Print deploy link
        run: |
          echo "Paste this into the nibrun dashboard's deploy-from-URL field:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/9router-linux-x64"
