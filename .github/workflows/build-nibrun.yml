name: Build 9Router Nibrun Binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.1"
          package-manager-cache: false

      - name: Show source layout
        shell: bash
        run: |
          echo "=== repository ==="
          pwd
          find . -maxdepth 3 -type f \
            \( -name package.json -o -name package-lock.json -o -name server.js \) \
            -print

      - name: Locate 9Router app
        shell: bash
        run: |
          if [ -f "app/package.json" ]; then
            echo "APP_DIR=app" >> "$GITHUB_ENV"
          elif [ -f "package/app/package.json" ]; then
            echo "APP_DIR=package/app" >> "$GITHUB_ENV"
          elif [ -f "package.json" ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "Could not find 9Router package.json"
            exit 1
          fi

      - name: Verify version
        shell: bash
        run: |
          echo "APP_DIR=$APP_DIR"
          node -p "require('./$APP_DIR/package.json').version"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          npm install --no-audit --no-fund

      - name: Build 9Router
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          npm run build

      - name: Verify Next build
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          test -f .next-cli-build/BUILD_ID
          test -d .next-cli-build/server
          test -d .next-cli-build/static

          echo "=== build size ==="
          du -sh .next-cli-build
          echo "=== node_modules ==="
          du -sh node_modules

      # ------------------------------------------------------------
      # Build a self-contained application payload.
      #
      # Nibrun runs a Linux executable. We therefore package the
      # complete 9Router runtime into one compressed asset and make
      # the executable unpack it at startup.
      # ------------------------------------------------------------

      - name: Create runtime payload
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          rm -rf nibrun-runtime
          mkdir -p nibrun-runtime

          cp -a .next-cli-build nibrun-runtime/
          cp -a public nibrun-runtime/
          cp -a node_modules nibrun-runtime/
          cp -a package.json nibrun-runtime/
          cp -a server.js nibrun-runtime/
          cp -a custom-server.js nibrun-runtime/

          echo "=== runtime ==="
          du -sh nibrun-runtime

          tar -C nibrun-runtime \
            -czf ../nibrun-runtime.tar.gz .

          echo "=== compressed payload ==="
          ls -lh ../nibrun-runtime.tar.gz

      - name: Create Nibrun launcher
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          cat > ../nibrun-main.js <<'EOF'
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const zlib = require('zlib');
          const { execFileSync } = require('child_process');

          const { getAsset } = require('node:sea');

          const base = path.join(
            os.tmpdir(),
            '9router-nibrun-' + process.pid
          );

          fs.mkdirSync(base, { recursive: true });

          const archive = getAsset('9router-runtime', 'buffer');

          const archivePath = path.join(base, 'runtime.tar.gz');

          fs.writeFileSync(archivePath, archive, {
            mode: 0o600
          });

          execFileSync(
            'tar',
            [
              '-xzf',
              archivePath,
              '-C',
              base
            ],
            {
              stdio: 'inherit'
            }
          );

          fs.unlinkSync(archivePath);

          process.env.NODE_ENV = 'production';

          const port =
            process.env.PORT ||
            process.env.NIBRUN_HTTP_PORT ||
            '3000';

          process.env.PORT = String(port);

          process.env.HOSTNAME =
            process.env.HOSTNAME ||
            '0.0.0.0';

          process.chdir(base);

          require(path.join(base, 'custom-server.js'));
          EOF

          echo "=== launcher ==="
          sed -n '1,220p' ../nibrun-main.js

      - name: Create SEA configuration
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          cat > ../sea-config.json <<'EOF'
          {
            "main": "./nibrun-main.js",
            "output": "./9router-nibrun.blob",
            "disableExperimentalSEAWarning": true,
            "useSnapshot": false,
            "useCodeCache": true,
            "assets": {
              "9router-runtime": "./nibrun-runtime.tar.gz"
            }
          }
          EOF

          cat ../sea-config.json

      - name: Generate SEA blob
        shell: bash
        run: |
          node --experimental-sea-config sea-config.json

          test -f 9router-nibrun.blob

          ls -lh 9router-nibrun.blob

      - name: Install postject
        shell: bash
        run: |
          npm install --global postject@1.0.0-alpha.6

          postject --version || true

      - name: Build Linux x64 executable
        shell: bash
        run: |
          cp "$(command -v node)" 9router-nibrun

          chmod +x 9router-nibrun

          postject \
            9router-nibrun \
            NODE_SEA_BLOB \
            9router-nibrun.blob \
            --sentinel-fuse NODE_SEA_FUSE_f6d2a3c8-9e51-4b7f-a2d4-9router

          chmod +x 9router-nibrun

      - name: Verify executable
        shell: bash
        run: |
          file 9router-nibrun

          ./9router-nibrun --version || true

          echo "=== executable size ==="
          ls -lh 9router-nibrun

      - name: Create Nibrun package
        shell: bash
        run: |
          mkdir -p dist

          cp 9router-nibrun dist/
          cp ../${APP_DIR}/package.json dist/9router-package.json

          cat > dist/README.txt <<'EOF'
          9Router v0.5.35 Nibrun build

          Platform:
            Linux x86_64

          Nibrun:
            Use the generated executable directly with:

              nib run ./9router-nibrun --name 9router --port 3000

          The executable contains the 9Router runtime and Node.js runtime.
          EOF

          tar -czf \
            9router-v0.5.35-nibrun-linux-x64.tar.gz \
            -C dist \
            9router-nibrun \
            9router-package.json \
            README.txt

          sha256sum \
            9router-nibrun \
            9router-v0.5.35-nibrun-linux-x64.tar.gz \
            > SHA256SUMS.txt

          echo "=== final files ==="
          ls -lh \
            9router-nibrun \
            9router-v0.5.35-nibrun-linux-x64.tar.gz \
            SHA256SUMS.txt

      - name: Upload Nibrun executable
        uses: actions/upload-artifact@v6
        with:
          name: 9router-v0.5.35-nibrun-linux-x64
          path: |
            9router-nibrun
            9router-v0.5.35-nibrun-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

