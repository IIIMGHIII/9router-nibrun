name: Build nibrun binary

on:
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the release + upload the asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # This repo holds only this workflow, not 9router's source —
      # pull the actual app from upstream. Pin "ref" to a release tag
      # (e.g. v0.5.35) instead of "master" if you want reproducible builds.
      - name: Checkout 9router source
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: master
          path: 9router

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Full install (with devDependencies) — the build needs typescript,
      # the Tailwind toolchain, etc. Using `npm install` rather than
      # `npm ci` since 9router doesn't commit a package-lock.json.
      - name: Install dependencies
        working-directory: 9router
        run: npm install

      - name: Build Next.js app
        working-directory: 9router
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Swap devDependencies out for a clean, complete production-only
      # node_modules. This is the fix for "Cannot find module" errors:
      # Next's .next/standalone output only ships whatever its tracer
      # *thinks* each page needs, and that tracing has real gaps (undici,
      # and whatever else it'd surface next). A full npm install has no
      # such gaps — everything genuinely depended on is present, full stop.
      - name: Install production-only dependencies
        working-directory: 9router
        run: npm install --omit=dev

      - name: Verify build is self-contained
        run: |
          test -f 9router/custom-server.js
          test -d 9router/.next
          test -d 9router/node_modules/next
          test -d 9router/node_modules/undici

      # nibrun caps uploaded binaries at 256 MB, and the full production
      # node_modules for an app this size carries real dead weight at
      # runtime: markdown, changelogs, source maps, .ts source (only the
      # compiled .js is ever required), and test fixtures. None of this
      # is loaded by node_modules resolution, so it's safe to strip.
      - name: Prune dead weight from node_modules
        run: |
          set -euo pipefail
          BEFORE=$(du -sh 9router/node_modules | cut -f1)
          find 9router/node_modules -type f \( \
              -iname '*.md' -o -iname '*.markdown' -o \
              -iname 'license*' -o -iname 'licence*' -o \
              -iname 'changelog*' -o -iname '*.map' -o \
              -iname '*.ts' \
            \) -delete
          find 9router/node_modules -type d \( \
              -iname 'test' -o -iname 'tests' -o -iname '__tests__' -o \
              -iname 'example' -o -iname 'examples' -o -iname 'docs' -o \
              -iname '.github' \
            \) -prune -exec rm -rf {} +
          AFTER=$(du -sh 9router/node_modules | cut -f1)
          echo "node_modules: $BEFORE -> $AFTER"

      # Full repo tree — real node_modules, real .next build, public/, src/
      # (custom-server.js dynamically loads a module under src/ if present),
      # custom-server.js, and package.json. .git and the build cache are
      # excluded. Piped through gzip -9 explicitly for max compression,
      # since every MB counts against nibrun's 256 MB binary cap.
      - name: Archive the build
        run: |
          tar cf - \
            --exclude=.git \
            --exclude=.next/cache \
            -C 9router . | gzip -9 > app-bundle.tar.gz
          echo "archive size: $(du -h app-bundle.tar.gz | cut -f1)"

      - name: Write launcher
        env:
          LAUNCHER_B64: |
            aW1wb3J0IGJ1bmRsZUFzc2V0IGZyb20gIi4vYXBwLWJ1bmRsZS50YXIuZ3oiIHdpdGggeyB0eXBl
            OiAiZmlsZSIgfTsKaW1wb3J0IHsgQlVORExFX1NUQU1QIH0gZnJvbSAiLi9zdGFtcC5qcyI7Cmlt
            cG9ydCB7IGV4aXN0c1N5bmMsIG1rZGlyU3luYywgcm1TeW5jLCB3cml0ZUZpbGVTeW5jLCByZWFk
            RmlsZVN5bmMgfSBmcm9tICJub2RlOmZzIjsKaW1wb3J0IHBhdGggZnJvbSAibm9kZTpwYXRoIjsK
            CmNvbnN0IG5pYnJ1bkRhdGFEaXIgPQogIHByb2Nlc3MuZW52Lk5JQlJVTl9EQVRBX0RJUiB8fCBw
            cm9jZXNzLmVudi5EQVRBX0RJUiB8fCAiL2FwcC9kYXRhIjsKY29uc3QgY29kZURpciA9IHBhdGgu
            am9pbihuaWJydW5EYXRhRGlyLCAiYXBwLWNvZGUiKTsKY29uc3Qgc3RhdGVEaXIgPSBwYXRoLmpv
            aW4obmlicnVuRGF0YURpciwgInN0YXRlIik7CmNvbnN0IHN0YW1wUGF0aCA9IHBhdGguam9pbihu
            aWJydW5EYXRhRGlyLCAiLmFwcC1jb2RlLXN0YW1wIik7Cgpta2RpclN5bmMoc3RhdGVEaXIsIHsg
            cmVjdXJzaXZlOiB0cnVlIH0pOwoKY29uc3QgcmVhZHkgPQogIGV4aXN0c1N5bmMocGF0aC5qb2lu
            KGNvZGVEaXIsICJjdXN0b20tc2VydmVyLmpzIikpICYmCiAgZXhpc3RzU3luYyhwYXRoLmpvaW4o
            Y29kZURpciwgIm5vZGVfbW9kdWxlcy9uZXh0IikpICYmCiAgZXhpc3RzU3luYyhzdGFtcFBhdGgp
            ICYmCiAgcmVhZEZpbGVTeW5jKHN0YW1wUGF0aCwgInV0ZjgiKS50cmltKCkgPT09IEJVTkRMRV9T
            VEFNUDsKCmlmICghcmVhZHkpIHsKICBybVN5bmMoY29kZURpciwgeyByZWN1cnNpdmU6IHRydWUs
            IGZvcmNlOiB0cnVlIH0pOwogIG1rZGlyU3luYyhjb2RlRGlyLCB7IHJlY3Vyc2l2ZTogdHJ1ZSB9
            KTsKICBjb25zdCB0YXJCdWYgPSBhd2FpdCBCdW4uZmlsZShidW5kbGVBc3NldCkuYnl0ZXMoKTsK
            ICBjb25zdCBjb3VudCA9IGF3YWl0IG5ldyBCdW4uQXJjaGl2ZSh0YXJCdWYpLmV4dHJhY3QoY29k
            ZURpcik7CiAgY29uc29sZS5sb2coIltuaWJydW5dIGV4dHJhY3RlZCAiICsgY291bnQgKyAiIGVu
            dHJpZXMiKTsKICB3cml0ZUZpbGVTeW5jKHN0YW1wUGF0aCwgQlVORExFX1NUQU1QKTsKfQoKaWYg
            KCFleGlzdHNTeW5jKHBhdGguam9pbihjb2RlRGlyLCAibm9kZV9tb2R1bGVzL25leHQiKSkpIHsK
            ICB0aHJvdyBuZXcgRXJyb3IoImJ1bmRsZSBtaXNzaW5nIG5vZGVfbW9kdWxlcy9uZXh0Iik7Cn0K
            CnByb2Nlc3MuZW52LkhPTUUgPSBzdGF0ZURpcjsKcHJvY2Vzcy5lbnYuREFUQV9ESVIgPSBzdGF0
            ZURpcjsKcHJvY2Vzcy5lbnYuTk9ERV9FTlYgPSAicHJvZHVjdGlvbiI7CnByb2Nlc3MuZW52LkhP
            U1ROQU1FID0gIjAuMC4wLjAiOwppZiAocHJvY2Vzcy5lbnYuTklCUlVOX0hUVFBfUE9SVCkgcHJv
            Y2Vzcy5lbnYuUE9SVCA9IHByb2Nlc3MuZW52Lk5JQlJVTl9IVFRQX1BPUlQ7Cgpwcm9jZXNzLmNo
            ZGlyKGNvZGVEaXIpOwoKLy8gUnVuIGluLXByb2Nlc3MgdW5kZXIgdGhpcyBzYW1lIEJ1biBydW50
            aW1lIOKAlCA5cm91dGVyJ3Mgb3duIHBhY2thZ2UuanNvbgovLyBkb2N1bWVudHMgZXhhY3RseSB0
            aGlzIChzdGFydDpidW4gLT4gImJ1biAuLy5uZXh0L3N0YW5kYWxvbmUvY3VzdG9tLXNlcnZlci5q
            cyIpCi8vIGFzIGEgc3VwcG9ydGVkIHdheSB0byBydW4gdGhlIGFwcCwgc28gbm8gc2VwYXJhdGUg
            Tm9kZSBydW50aW1lIGlzIG5lZWRlZC4KcmVxdWlyZShwYXRoLmpvaW4oY29kZURpciwgImN1c3Rv
            bS1zZXJ2ZXIuanMiKSk7Cg==
        run: |
          echo "$LAUNCHER_B64" | base64 -d > launcher.js
          echo "export const BUNDLE_STAMP = \"$(sha256sum app-bundle.tar.gz | awk '{print $1}')\";" > stamp.js

      # launcher.js only touches fs/path (Bun/Node builtins) plus the
      # embedded tar.gz asset — nothing here needs Next.js's module graph,
      # so this compiles cleanly regardless of what's inside the archive.
      - name: Compile launcher to a single Linux x64 binary
        run: |
          bun build --compile \
            --target=bun-linux-x64 \
            ./launcher.js \
            --outfile 9router-linux-x64

      # nibrun rejects anything over 256 MB at deploy time — fail here
      # instead, with a size on record, rather than burning a deploy attempt.
      - name: Verify binary is under nibrun's 256 MB cap
        run: |
          SIZE=$(stat -c%s 9router-linux-x64)
          echo "binary size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          if [ "$SIZE" -gt $((256 * 1024 * 1024)) ]; then
            echo "::error::Binary is $((SIZE / 1024 / 1024)) MB, over nibrun's 256 MB cap"
            exit 1
          fi

      - name: Checksum
        run: sha256sum 9router-linux-x64 > SHA256SUMS

      # Tag with the date, so a same-day rerun doesn't collide.
      - name: Compute release tag
        id: tag
        run: |
          base="v$(date +%Y.%m.%d)"
          n=1
          tag="${base}-${n}"
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}-${n}"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            9router-linux-x64
            SHA256SUMS

      - name: Print deploy link
        run: |
          echo "Paste this into the nibrun dashboard's deploy-from-URL field:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/9router-linux-x64"
