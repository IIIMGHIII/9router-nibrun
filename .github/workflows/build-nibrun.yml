name: Build nibrun binary

on:
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the release + upload the asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # This repo holds only this workflow, not 9router's source —
      # pull the actual app from upstream. Pin `ref` to a release tag
      # (e.g. v0.5.35) instead of `master` if you want reproducible builds.
      - name: Checkout 9router source
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: master

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 9router installs with npm but builds fine under bun for this step,
      # matching the repo's own build:bun script.
      - name: Install dependencies
        run: npm install

      - name: Build Next.js standalone bundle
        run: bun run build:bun
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Compiles .next/standalone/custom-server.js (+ its bundled deps)
      # into one self-contained Linux x64 executable — the shape nibrun expects.
      - name: Compile to a single Linux x64 binary
        run: |
          bun build --compile \
            --target=bun-linux-x64 \
            ./.next/standalone/custom-server.js \
            --outfile 9router-linux-x64

      - name: Checksum
        run: sha256sum 9router-linux-x64 > SHA256SUMS

      # Tag with the date, so a same-day rerun doesn't collide.
      - name: Compute release tag
        id: tag
        run: |
          base="v$(date +%Y.%m.%d)"
          n=1
          tag="${base}-${n}"
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}-${n}"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            9router-linux-x64
            SHA256SUMS

      - name: Print deploy link
        run: |
          echo "Paste this into the nibrun dashboard's deploy-from-URL field:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/9router-linux-x64"
