name: Deploy to nibrun

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # This repo holds only the deploy workflow, not 9router's source —
      # pull the actual app from upstream. Pin `ref` to a release tag
      # (e.g. v0.5.35) instead of `master` if you want reproducible builds.
      - name: Checkout 9router source
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: master

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 9router installs with npm but builds fine under bun for this step,
      # matching the repo's own build:bun script.
      - name: Install dependencies
        run: npm install

      - name: Build Next.js standalone bundle
        run: bun run build:bun
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Compiles .next/standalone/custom-server.js (+ its bundled deps)
      # into one self-contained Linux x64 executable — the shape nibrun expects.
      - name: Compile to a single Linux x64 binary
        run: |
          bun build --compile \
            --target=bun-linux-x64 \
            ./.next/standalone/custom-server.js \
            --outfile 9router-linux-x64

      - name: Upload binary as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9router-linux-x64
          path: 9router-linux-x64
          retention-days: 7

      # --- Deploy step ---
      # NOTE: `nib`'s non-interactive/CI auth flag isn't something I could
      # confirm from public docs (the CLI is only days old as of writing).
      # Run `nib login --help` / `nib run --help` locally once to get the
      # exact flag or env var name, then adjust the two lines below.
      - name: Install nib CLI
        run: curl -fsSL https://nibrun.com/install.sh | sh

      - name: Deploy to nibrun
        env:
          # Replace NIBRUN_TOKEN with whatever `nib --help` shows for
          # non-interactive auth (API key / account token / etc.)
          NIBRUN_TOKEN: ${{ secrets.NIBRUN_TOKEN }}
          JWT_SECRET: ${{ secrets.NINEROUTER_JWT_SECRET }}
          INITIAL_PASSWORD: ${{ secrets.NINEROUTER_INITIAL_PASSWORD }}
          API_KEY_SECRET: ${{ secrets.NINEROUTER_API_KEY_SECRET }}
          MACHINE_ID_SALT: ${{ secrets.NINEROUTER_MACHINE_ID_SALT }}
        run: |
          nib run ./9router-linux-x64 \
            --name 9router \
            --env NODE_ENV=production \
            --env NEXT_TELEMETRY_DISABLED=1 \
            --env JWT_SECRET="$JWT_SECRET" \
            --env INITIAL_PASSWORD="$INITIAL_PASSWORD" \
            --env API_KEY_SECRET="$API_KEY_SECRET" \
            --env MACHINE_ID_SALT="$MACHINE_ID_SALT" \
            --env DATA_DIR='${NIBRUN_DATA_DIR}' \
            --env HOME='${NIBRUN_DATA_DIR}'
          # PORT is injected automatically by nibrun (alias of NIBRUN_HTTP_PORT),
          # and NIBRUN_HOSTNAME is what gives you the public HTTPS URL — no
          # need to set either yourself.
