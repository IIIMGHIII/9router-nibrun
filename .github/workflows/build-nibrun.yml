name: Build nibrun binary

on:
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the release + upload the asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # This repo holds only this workflow, not 9router's source —
      # pull the actual app from upstream. Pin `ref` to a release tag
      # (e.g. v0.5.35) instead of `master` if you want reproducible builds.
      - name: Checkout 9router source
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: master
          path: 9router

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 9router installs with npm but builds fine under bun for this step,
      # matching the repo's own build:bun script.
      - name: Install dependencies
        working-directory: 9router
        run: npm install

      - name: Build Next.js standalone bundle
        working-directory: 9router
        run: bun run build:bun
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify standalone build is self-contained
        run: |
          test -f 9router/.next/standalone/custom-server.js
          test -f 9router/.next/standalone/server.js

      # Bun's --compile cannot statically bundle the real Next.js server
      # (its internals reference dozens of optional/dev-only packages never
      # meant to be traced ahead of time — webpack, sass, critters, the
      # react-server-dom variants, etc.). So instead of compiling the app,
      # we archive the whole working standalone build (real files, real
      # node_modules) and let a tiny launcher extract + require() it from
      # real disk at boot — ordinary runtime module resolution, no static
      # bundling involved.
      - name: Archive the standalone build
        run: tar czf app-bundle.tar.gz -C 9router/.next/standalone .

      - name: Write launcher
        run: |
          cat > launcher.js << 'EOF'
          import bundleAsset from "./app-bundle.tar.gz" with { type: "file" };
          import { existsSync, mkdirSync, rmSync, writeFileSync } from "fs";
          import { execFileSync } from "child_process";
          import path from "path";

          const nibrunDataDir = process.env.NIBRUN_DATA_DIR || process.env.DATA_DIR || "/app/data";

          // Code is re-extracted fresh on every boot, so it always matches the
          // currently deployed binary — never mix this with persistent app state.
          const codeDir = path.join(nibrunDataDir, "app-code");

          // 9router's own database/config lives here instead, untouched by extraction.
          const stateDir = path.join(nibrunDataDir, "state");

          rmSync(codeDir, { recursive: true, force: true });
          mkdirSync(codeDir, { recursive: true });
          mkdirSync(stateDir, { recursive: true });

          const tarBuf = Buffer.from(await Bun.file(bundleAsset).arrayBuffer());
          const tmpTar = "/tmp/app-bundle.tar.gz";
          writeFileSync(tmpTar, tarBuf);
          execFileSync("tar", ["xzf", tmpTar, "-C", codeDir]);

          // HOME=/app is read-only in the guest; point HOME and 9router's DATA_DIR
          // at the writable, persistent state directory instead.
          process.env.HOME = stateDir;
          process.env.DATA_DIR = stateDir;

          require(path.join(codeDir, "custom-server.js"));
          EOF

      # launcher.js only touches fs/path/child_process (Bun builtins) plus
      # the embedded tar.gz asset — nothing here needs Next.js's module
      # graph, so this compiles cleanly.
      - name: Compile launcher to a single Linux x64 binary
        run: |
          bun build --compile \
            --target=bun-linux-x64 \
            ./launcher.js \
            --outfile 9router-linux-x64

      - name: Checksum
        run: sha256sum 9router-linux-x64 > SHA256SUMS

      # Tag with the date, so a same-day rerun doesn't collide.
      - name: Compute release tag
        id: tag
        run: |
          base="v$(date +%Y.%m.%d)"
          n=1
          tag="${base}-${n}"
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}-${n}"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            9router-linux-x64
            SHA256SUMS

      - name: Print deploy link
        run: |
          echo "Paste this into the nibrun dashboard's deploy-from-URL field:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/9router-linux-x64"
