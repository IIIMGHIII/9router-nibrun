name: Build nibrun binary
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 9router source
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: master
          path: 9router

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: 9router
        run: npm install

      - name: Build Next.js standalone bundle
        working-directory: 9router
        run: bun run build:bun
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify standalone build is self-contained
        run: |
          test -f 9router/.next/standalone/custom-server.js
          test -f 9router/.next/standalone/server.js
          test -d 9router/.next/standalone/node_modules/next

      - name: Download portable Node
        run: |
          set -euo pipefail
          TARBALL=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk '/node-v22\.[0-9]+\.[0-9]+-linux-x64\.tar\.xz$/{print $2; exit}')
          curl -fsSLo node.tar.xz "https://nodejs.org/dist/latest-v22.x/${TARBALL}"
          tar -xJf node.tar.xz
          cp node-v22.*/bin/node 9router/.next/standalone/node
          chmod +x 9router/.next/standalone/node
          9router/.next/standalone/node -v

      - name: Archive the standalone build
        run: tar czf app-bundle.tar.gz -C 9router/.next/standalone .

