name: Build nibrun binary

on:
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the release + upload the asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # This repo holds only this workflow, not 9router's source —
      # pull the actual app from upstream. Pin "ref" to a release tag
      # (e.g. v0.5.35) instead of "master" if you want reproducible builds.
      - name: Checkout 9router source
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: master
          path: 9router

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Full install (with devDependencies) — the build needs typescript,
      # the Tailwind toolchain, etc.
      - name: Install dependencies
        working-directory: 9router
        run: npm ci

      - name: Build Next.js app
        working-directory: 9router
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Swap devDependencies out for a clean, complete production-only
      # node_modules. This is the actual fix for the "Cannot find module"
      # errors: Next's .next/standalone output only ships whatever its
      # tracer *thinks* each page needs, and that tracing has real gaps
      # (undici, and whatever else it'd surface next). A full npm install
      # against package-lock.json has no such gaps — everything genuinely
      # depended on is present, full stop.
      - name: Install production-only dependencies
        working-directory: 9router
        run: npm ci --omit=dev

      - name: Verify build is self-contained
        run: |
          test -f 9router/custom-server.js
          test -d 9router/.next
          test -d 9router/node_modules/next
          test -d 9router/node_modules/undici

      - name: Download portable Node
        run: |
          set -euo pipefail
          TARBALL=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk '/node-v22\.[0-9]+\.[0-9]+-linux-x64\.tar\.xz$/{print $2; exit}')
          curl -fsSLo node.tar.xz "https://nodejs.org/dist/latest-v22.x/${TARBALL}"
          tar -xJf node.tar.xz
          cp node-v22.*/bin/node 9router/node
          chmod +x 9router/node
          9router/node -v

      # Full repo tree — real node_modules, real .next build, public/, src/
      # (custom-server.js dynamically loads a module under src/ if present),
      # custom-server.js, package.json, and the portable node binary.
      # .git and the build cache are excluded; nothing else is trimmed.
      - name: Archive the build
        run: |
          tar czf app-bundle.tar.gz \
            --exclude=.git \
            --exclude=.next/cache \
            -C 9router .

