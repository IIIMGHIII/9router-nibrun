      - name: Compile launcher to a single Linux x64 binary
        run: bun build --compile --target=bun-linux-x64 ./launcher.js --outfile 9router-linux-x64

      - name: Checksum
        run: sha256sum 9router-linux-x64 > SHA256SUMS

      - name: Compute release tag
        id: tag
        run: |
          base="v$(date +%Y.%m.%d)"
          n=1
          tag="${base}-${n}"
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}-${n}"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            9router-linux-x64
            SHA256SUMS

      - name: Print deploy link
        run: |
          echo "Paste this into the nibrun dashboard's deploy-from-URL field:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/9router-linux-x64"
